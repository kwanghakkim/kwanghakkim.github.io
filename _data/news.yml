# ──────────────────────────────────────────────────────────────────────
# NEWS — single source of truth for the homepage News section (shows the
# first 4 entries) and the /news page (shows all entries).
#
# NEW ITEMS GO AT THE TOP. The order in this file IS the display order —
# nothing is sorted automatically, so there are no date-format gotchas.
#
# To add an item, paste this line at the top of the list and edit it:
#   - { date: "Aug 2026", text: "Your update here." }
#
# Optional: add a link to make the item text clickable:
#   - { date: "Aug 2026", text: "Your update here.", link: "https://example.com" }
#
# The year shown in "date" is also used for the year groupings on /news,
# so end the date with the 4-digit year (e.g. "Jul 2026").
# ──────────────────────────────────────────────────────────────────────

